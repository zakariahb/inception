services:
  nginx:
    build: requirements/nginx
    restart: on-failure
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/html
    depends_on:
      - wordpress
  wordpress:
    build: requirements/wordpress
    restart: on-failure
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
  mariadb:
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u root -p'$PASSWORD' -e 'SELECT 1;' || exit 1"]
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    build: requirements/mariadb
    restart: on-failure
    networks:
      - inception
    env_file:
      - .env
    volumes:
      - mariadb_vol:/var/lib/mysql

networks:
  inception:

volumes:
  wordpress_vol:
    name: wordpress_vol
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/client/data/wordpress
  mariadb_vol:
    name: mariadb_vol
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/client/data/mariadb