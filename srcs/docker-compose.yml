services:
  nginx:
    build: requirements/nginx
    image: nginx
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/html
    depends_on:
      - wordpress
  wordpress:
    build: requirements/wordpress
    image: wordpress
    container_name: wordpress
    networks:
      - inception
    volumes:
      - wordpress_vol:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
  mariadb:
    image: mariadb
    container_name: mariadb
    build: requirements/mariadb
    networks:
      - inception
    env_file:
      - .env
    healthcheck:
       test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
    volumes:
      - mariadb_vol:/var/lib/mysql

networks:
  inception:
    name: inception

volumes:
  wordpress_vol:
  mariadb_vol:
