server {
    listen 443 ssl;
    server_name zalaksya.42.fr;
    ssl_certificate /etc/nginx/zalaksya.crt;
    ssl_certificate_key /etc/nginx/zalaksya.key;
    ssl_protocols TLSv1.2   TLSv1.3;
    location / {
        root /var/www/html;
        index index.html;
    }
     location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }
}
